[package]
name = "controller_to_pc"
version = "0.2.0"
edition = "2024"
description = "Use a game controller as a Windows mouse and media remote"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
gilrs = { version = "0.11", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
winreg = "0.55"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
vigem-rust = { version = "0.2", default-features = false, features = ["x360"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
